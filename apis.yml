name: Mount
description: >-
  Mount is a Y Combinator-backed (P26) AI-native insurance carrier built
  specifically for companies deploying autonomous AI agents in real business
  processes. Its first product, an AI liability policy marketed as ActiveCover,
  pairs continuous vulnerability scanning and red-teaming of AI deployments with
  purpose-built liability coverage across AI-specific risk categories. Mount
  secures the agent workflow, quantifies the residual operational risk, helps
  fix vulnerabilities, and transfers the remaining risk through insurance,
  advertising fast activation and dynamic, usage-based pricing. Founded in 2026
  by Fabian Amherd and John Bachmann and based in San Francisco, Mount aims to
  rebuild the commercial-insurance carrier stack from the ground up with AI at
  its core. As of this profile Mount publishes a marketing site and blog but no
  public developer, API, or SDK surface.
